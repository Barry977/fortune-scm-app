<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>命运 - 登录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; border: none; outline: none; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            -webkit-user-select: none;
            overflow: hidden;
        }

        .login-card {
            width: 360px;
            background: #fff;
            border-radius: 12px;
            padding: 36px 32px 28px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            position: relative;
        }

        /* 窗口控制按钮 */
        .window-controls {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 6px;
        }
        .win-btn {
            width: 28px;
            height: 28px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: background 0.15s;
            background: transparent;
            color: #999;
        }
        .win-btn:hover { background: #f0f0f0; color: #333; }
        .win-btn.close:hover { background: #fee2e2; color: #dc2626; }

        .logo {
            text-align: center;
            margin-bottom: 28px;
        }
        .logo svg { width: 48px; height: 48px; margin-bottom: 10px; }
        .logo-name {
            font-size: 22px;
            font-weight: 700;
            color: #1a1a1a;
            letter-spacing: 2px;
        }
        .logo-en {
            font-size: 10px;
            color: #999;
            letter-spacing: 4px;
            margin-top: 2px;
        }

        .form-group { margin-bottom: 16px; }
        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #666;
            margin-bottom: 6px;
        }
        .form-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            background: #fff;
            color: #333;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-input:focus {
            border-color: #fbbf24;
            box-shadow: 0 0 0 3px rgba(251,191,36,0.1);
        }
        .form-input::placeholder { color: #bbb; }

        .login-btn {
            width: 100%;
            padding: 11px;
            background: #fbbf24;
            color: #1a1a1a;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 4px;
        }
        .login-btn:hover { background: #f59e0b; }
        .login-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .form-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
        }
        .remember-me {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #999;
            cursor: pointer;
        }
        .remember-me input { accent-color: #fbbf24; }
        .forgot-password {
            font-size: 12px;
            color: #fbbf24;
            text-decoration: none;
        }
        .forgot-password:hover { text-decoration: underline; }

        .error-msg, .success-msg {
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 14px;
            display: none;
        }
        .error-msg { background: #fee2e2; color: #dc2626; }
        .success-msg { background: #d1fae5; color: #065f46; }

        .version {
            text-align: center;
            margin-top: 18px;
            font-size: 11px;
            color: #ccc;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="window-controls">
            <button class="win-btn" onclick="minimizeWindow()" title="最小化">─</button>
            <button class="win-btn close" onclick="closeWindow()" title="关闭">✕</button>
        </div>

        <div class="logo">
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M20 55 L50 20 L80 55" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M30 48 L50 28 L70 48" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="50" cy="60" r="5" fill="#fbbf24"/>
                <path d="M43 68 L50 60 L57 68" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
            <div class="logo-name">命运</div>
            <div class="logo-en">DESTINY</div>
        </div>

        <div id="errorMsg" class="error-msg"></div>
        <div id="successMsg" class="success-msg"></div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label class="form-label">用户名</label>
                <input type="text" class="form-input" id="username" placeholder="请输入用户名" required autofocus>
            </div>
            <div class="form-group">
                <label class="form-label">密码</label>
                <input type="password" class="form-input" id="password" placeholder="请输入密码" required>
            </div>
            <button type="submit" class="login-btn" id="loginBtn">登录</button>
        </form>

        <div class="form-footer">
            <label class="remember-me">
                <input type="checkbox" id="rememberMe"> 记住我
            </label>
            <a href="#" class="forgot-password">忘记密码？</a>
        </div>

        <div class="version">v1.0.0</div>
    </div>

    <script>
        const API_BASE = window.location.origin;

        // ── 记住我：页面加载时恢复 ──
        document.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('remembered_user');
            const savedPass = localStorage.getItem('remembered_pass');
            if (savedUser) {
                document.getElementById('username').value = savedUser;
                document.getElementById('rememberMe').checked = true;
            }
            if (savedPass) {
                document.getElementById('password').value = savedPass;
            }
        });

        // 窗口控制 — 兼容 pywebview 和普通浏览器
        function minimizeWindow() {
            if (window.pywebview && window.pywebview.api) {
                window.pywebview.api.minimize_window();
            }
        }
        function closeWindow() {
            if (window.pywebview && window.pywebview.api) {
                // 最小化到托盘，而不是关闭
                window.pywebview.api.minimize_to_tray();
            } else {
                window.close();
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errorDiv = document.getElementById('errorMsg');
            const successDiv = document.getElementById('successMsg');

            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            btn.disabled = true;
            btn.textContent = '登录中...';

            try {
                const formData = new URLSearchParams();
                formData.append('username', document.getElementById('username').value);
                formData.append('password', document.getElementById('password').value);

                const response = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData.toString()
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('user', JSON.stringify(data.user));

                    // 记住我
                    const rememberMe = document.getElementById('rememberMe').checked;
                    if (rememberMe) {
                        localStorage.setItem('remembered_user', document.getElementById('username').value);
                        localStorage.setItem('remembered_pass', document.getElementById('password').value);
                    } else {
                        localStorage.removeItem('remembered_user');
                        localStorage.removeItem('remembered_pass');
                    }

                    successDiv.textContent = '登录成功，正在跳转...';
                    successDiv.style.display = 'block';
                    // 保存token到本地文件
                    if (window.pywebview && window.pywebview.api) {
                        window.pywebview.api.save_token(data.access_token);
                    }
                    setTimeout(() => {
                        window.location.href = '/dashboard.html';
                    }, 800);
                } else {
                    errorDiv.textContent = data.detail || '登录失败';
                    errorDiv.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = '登录';
                }
            } catch (err) {
                errorDiv.textContent = '网络错误，请稍后重试';
                errorDiv.style.display = 'block';
                btn.disabled = false;
                btn.textContent = '登录';
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') document.getElementById('loginForm').requestSubmit();
        });
    </script>
</body>
</html>
