<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORTUNE SCM - 登录</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 自定义动画 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.5s ease-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .animate-shake {
            animation: shake 0.3s ease-in-out;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="w-full max-w-md p-8">
        <!-- 登录卡片 -->
        <div class="bg-white rounded-lg shadow-lg p-8 animate-fade-in">
            <!-- Logo/标题 -->
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-gray-800 mb-2">FORTUNE SCM</h1>
                <p class="text-gray-500 text-sm">物流管理系统</p>
            </div>

            <!-- 错误提示区域 -->
            <div id="error-message" class="hidden mb-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded text-sm animate-shake"></div>

            <!-- 登录表单 -->
            <form id="login-form" class="space-y-6">
                <!-- 用户名输入框 -->
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-1">
                        用户名
                    </label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-colors"
                        placeholder="请输入用户名"
                        autocomplete="username"
                    >
                </div>

                <!-- 密码输入框 -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
                        密码
                    </label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-colors"
                        placeholder="请输入密码"
                        autocomplete="current-password"
                    >
                </div>

                <!-- 登录按钮 -->
                <button
                    type="submit"
                    id="login-btn"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed"
                >
                    <span id="btn-text">登录</span>
                    <span id="btn-loading" class="hidden">
                        <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white inline" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        登录中...
                    </span>
                </button>
            </form>

            <!-- 提示信息 -->
            <div class="mt-6 text-center text-sm text-gray-500">
                <p>默认管理员账号: <span class="font-medium text-gray-700">admin / admin123</span></p>
            </div>
        </div>

        <!-- 页脚 -->
        <div class="mt-8 text-center text-xs text-gray-400">
            <p> FORTUNE SCM. All rights reserved.</p>
        </div>
    </div>

    <script>
        // 获取DOM元素
        const loginForm = document.getElementById('login-form');
        const errorMessage = document.getElementById('error-message');
        const loginBtn = document.getElementById('login-btn');
        const btnText = document.getElementById('btn-text');
        const btnLoading = document.getElementById('btn-loading');

        // API基础URL
        const API_BASE_URL = 'http://localhost:8000';

        // 显示错误信息
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.remove('hidden');
            // 触发重绘以重新播放动画
            errorMessage.style.animation = 'none';
            errorMessage.offsetHeight; // 触发重绘
            errorMessage.style.animation = '';
        }

        // 隐藏错误信息
        function hideError() {
            errorMessage.classList.add('hidden');
        }

        // 设置按钮加载状态
        function setLoading(isLoading) {
            loginBtn.disabled = isLoading;
            if (isLoading) {
                btnText.classList.add('hidden');
                btnLoading.classList.remove('hidden');
            } else {
                btnText.classList.remove('hidden');
                btnLoading.classList.add('hidden');
            }
        }

        // 处理登录表单提交
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            // 前端验证
            if (!username) {
                showError('请输入用户名');
                return;
            }
            if (!password) {
                showError('请输入密码');
                return;
            }

            setLoading(true);

            try {
                // 使用FormData格式提交，符合OAuth2PasswordRequestForm要求
                const formData = new URLSearchParams();
                formData.append('username', username);
                formData.append('password', password);

                const response = await fetch(`${API_BASE_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    // 登录成功，保存token到localStorage
                    localStorage.setItem('access_token', data.access_token);
                    localStorage.setItem('token_expires', Date.now() + data.expires_in * 1000);
                    localStorage.setItem('user_info', JSON.stringify(data.user));

                    // 跳转到主页
                    window.location.href = '/dashboard.html';
                } else {
                    // 登录失败
                    showError(data.detail || '登录失败，请检查用户名和密码');
                }
            } catch (error) {
                console.error('登录请求失败:', error);
                showError('网络错误，请检查后端服务是否运行');
            } finally {
                setLoading(false);
            }
        });

        // 输入框获得焦点时隐藏错误信息
        document.getElementById('username').addEventListener('focus', hideError);
        document.getElementById('password').addEventListener('focus', hideError);

        // 页面加载时检查是否已登录
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('access_token');
            const expires = localStorage.getItem('token_expires');
            
            if (token && expires && Date.now() < parseInt(expires)) {
                // 已登录且token未过期，直接跳转
                window.location.href = '/dashboard.html';
            }
        });
    </script>
</body>
</html>
