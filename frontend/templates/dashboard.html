<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>命运 - 控制面板</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            display: flex;
            min-height: 100vh;
        }
        
        /* 左侧导航栏 */
        .sidebar {
            width: 220px;
            background: white;
            border-right: 1px solid #e5e5e5;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
        }
        .sidebar-logo {
            padding: 24px 20px;
            border-bottom: 1px solid #f5f5f5;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .sidebar-logo-icon { width: 36px; height: 36px; }
        .sidebar-logo-text { display: flex; flex-direction: column; }
        .sidebar-brand { font-size: 16px; font-weight: 700; color: #1a1a1a; }
        .sidebar-brand-en { font-size: 10px; color: #999; letter-spacing: 2px; }
        .nav-menu { flex: 1; padding: 16px 12px; overflow-y: auto; }
        .nav-section { margin-bottom: 8px; }
        .nav-section-title {
            font-size: 11px;
            color: #999;
            padding: 8px 12px 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s;
            font-size: 14px;
            color: #666;
            margin-bottom: 2px;
            text-decoration: none;
        }
        .nav-item:hover { background: #f9fafb; color: #333; }
        .nav-item.active {
            background: #fffbeb;
            color: #1a1a1a;
            font-weight: 500;
            border-left: 3px solid #fbbf24;
        }
        .nav-icon { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
        
        /* 主内容区 */
        .main-content {
            flex: 1;
            margin-left: 220px;
            padding: 24px;
        }
        
        /* 顶部栏 */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .page-title { font-size: 24px; font-weight: 600; color: #1a1a1a; }
        .top-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .page-subtitle { font-size: 13px; color: #999; margin-top: 4px; }
        
        /* 按钮 */
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            text-decoration: none;
        }
        .btn-primary {
            background: #fbbf24;
            color: #1a1a1a;
        }
        .btn-primary:hover { background: #f59e0b; }
        .btn-secondary {
            background: white;
            color: #666;
            border: 1px solid #e5e5e5;
        }
        .btn-secondary:hover { background: #f9fafb; }
        
        /* 统计卡片 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            border: 1px solid #e5e5e5;
        }
        .stat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .stat-title { font-size: 13px; color: #999; }
        .stat-icon {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
        .stat-icon.yellow { background: #fffbeb; color: #fbbf24; }
        .stat-icon.green { background: #d1fae5; color: #059669; }
        .stat-icon.blue { background: #dbeafe; color: #2563eb; }
        .stat-icon.purple { background: #ede9fe; color: #7c3aed; }
        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 4px;
        }
        
        /* 主内容网格 */
        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }
        .card {
            background: white;
            border-radius: 10px;
            border: 1px solid #e5e5e5;
            overflow: hidden;
        }
        .card-header {
            padding: 16px 20px;
            border-bottom: 1px solid #f5f5f5;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-title {
            font-size: 15px;
            font-weight: 600;
            color: #1a1a1a;
        }
        .card-action {
            font-size: 13px;
            color: #fbbf24;
            cursor: pointer;
            text-decoration: none;
        }
        .card-action:hover { text-decoration: underline; }
        .card-body { padding: 20px; }
        
        /* 最近客户 */
        .customer-list { list-style: none; }
        .customer-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid #f5f5f5;
        }
        .customer-item:last-child { border-bottom: none; }
        .customer-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: #666;
            font-size: 14px;
        }
        .customer-info { flex: 1; }
        .customer-name { font-size: 14px; font-weight: 500; color: #333; }
        .customer-company { font-size: 12px; color: #999; }
        .customer-time { font-size: 12px; color: #999; }
        
        /* 状态分布 */
        .status-bar { margin-bottom: 12px; }
        .status-bar-header {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 4px;
        }
        .status-bar-label { color: #333; }
        .status-bar-value { color: #666; }
        .status-bar-track {
            height: 8px;
            background: #f3f4f6;
            border-radius: 4px;
            overflow: hidden;
        }
        .status-bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s ease;
        }
        
        /* 活动列表 */
        .activity-list { list-style: none; }
        .activity-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid #f5f5f5;
            font-size: 14px;
        }
        .activity-item:last-child { border-bottom: none; }
        .activity-icon {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            flex-shrink: 0;
        }
        .activity-icon.create { background: #d1fae5; color: #059669; }
        .activity-icon.update { background: #dbeafe; color: #2563eb; }
        .activity-icon.contact { background: #fef3c7; color: #92400e; }
        .activity-text { flex: 1; color: #333; line-height: 1.4; }
        .activity-time { font-size: 12px; color: #999; flex-shrink: 0; }
        
        /* 趋势图（简化柱状图） */
        .trend-chart {
            display: flex;
            align-items: flex-end;
            gap: 4px;
            height: 150px;
            padding: 0 4px;
        }
        .trend-bar-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
            justify-content: flex-end;
        }
        .trend-bar {
            width: 100%;
            max-width: 24px;
            background: #fbbf24;
            border-radius: 3px 3px 0 0;
            min-height: 2px;
            transition: height 0.3s ease;
            position: relative;
        }
        .trend-bar:hover { background: #f59e0b; }
        .trend-bar-label {
            font-size: 10px;
            color: #999;
            margin-top: 6px;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            max-height: 50px;
            overflow: hidden;
        }
        .trend-legend {
            display: flex;
            gap: 16px;
            margin-top: 12px;
            font-size: 12px;
            color: #666;
        }
        .trend-legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .trend-legend-dot {
            width: 8px;
            height: 8px;
            border-radius: 2px;
        }
        
        /* 加载状态 */
        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #e5e5e5;
            border-top-color: #fbbf24;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }
        .empty-state-icon { font-size: 36px; margin-bottom: 8px; }
        .empty-state-text { font-size: 14px; color: #bbb; }
        
        /* 响应式 */
        @media (max-width: 1200px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 900px) {
            .content-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <!-- 左侧导航栏 -->
    <nav class="sidebar">
        <div class="sidebar-logo">
            <img src="/static/icon.png" alt="Logo" class="sidebar-logo-icon">
            <div class="sidebar-logo-text">
                <span class="sidebar-brand">命运</span>
                <span class="sidebar-brand-en">DESTINY</span>
            </div>
        </div>
        <div class="nav-menu">
            <div class="nav-section">
                <div class="nav-section-title">概览</div>
                <a href="/dashboard" onclick="window.location.href='/dashboard'; return false;" class="nav-item active">
                    <span class="nav-icon">📊</span>
                    <span>控制面板</span>
                </a>
            </div>
            <div class="nav-section">
                <div class="nav-section-title">业务</div>
                <a href="/crm" onclick="window.location.href='/crm'; return false;" class="nav-item">
                    <span class="nav-icon">👥</span>
                    <span>客户管理</span>
                </a>
                <a href="/linkedin" onclick="window.location.href='/linkedin'; return false;" class="nav-item">
                    <span class="nav-icon">🔗</span>
                    <span>LinkedIn</span>
                </a>
                <a href="/email" onclick="window.location.href='/email'; return false;" class="nav-item">
                    <span class="nav-icon">📧</span>
                    <span>邮件营销</span>
                </a>
            </div>
            <div class="nav-section">
                <div class="nav-section-title">工具</div>
                <a href="/ai_config" onclick="window.location.href='/ai_config'; return false;" class="nav-item">
                    <span class="nav-icon">🤖</span>
                    <span>AI配置</span>
                </a>
                <a href="/materials" onclick="window.location.href='/materials'; return false;" class="nav-item">
                    <span class="nav-icon">📁</span>
                    <span>素材库</span>
                </a>
                <a href="/analytics" onclick="window.location.href='/analytics'; return false;" class="nav-item">
                    <span class="nav-icon">📈</span>
                    <span>数据分析</span>
                </a>
            </div>
            <div class="nav-section">
                <div class="nav-section-title">系统</div>
                <a href="/scheduler" onclick="window.location.href='/scheduler'; return false;" class="nav-item">
                    <span class="nav-icon">⏰</span>
                    <span>定时任务</span>
                </a>
                <a href="/settings" onclick="window.location.href='/settings'; return false;" class="nav-item">
                    <span class="nav-icon">⚙️</span>
                    <span>设置</span>
                </a>
            </div>
        </div>
    </nav>
    
    <!-- 主内容区 -->
    <main class="main-content">
        <div class="top-bar">
            <div>
                <h1 class="page-title">控制面板</h1>
                <div class="page-subtitle" id="greeting"></div>
            </div>
            <div class="top-actions">
                <a href="/crm" onclick="window.location.href='/crm'; return false;" class="btn btn-primary">+ 添加客户</a>
                <button class="btn btn-secondary" onclick="refreshAll()">🔄 刷新</button>
            </div>
        </div>
        
        <!-- 统计卡片 -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-header">
                    <span class="stat-title">总客户数</span>
                    <span class="stat-icon yellow">👥</span>
                </div>
                <div class="stat-value" id="totalCustomers">--</div>
            </div>
            <div class="stat-card">
                <div class="stat-header">
                    <span class="stat-title">本月新增</span>
                    <span class="stat-icon green">✨</span>
                </div>
                <div class="stat-value" id="newThisMonth">--</div>
            </div>
            <div class="stat-card">
                <div class="stat-header">
                    <span class="stat-title">今日联系</span>
                    <span class="stat-icon blue">📋</span>
                </div>
                <div class="stat-value" id="todayContacted">--</div>
            </div>
            <div class="stat-card">
                <div class="stat-header">
                    <span class="stat-title">成交客户</span>
                    <span class="stat-icon purple">🏆</span>
                </div>
                <div class="stat-value" id="wonCustomers">--</div>
            </div>
        </div>
        
        <!-- 主内容网格 -->
        <div class="content-grid">
            <!-- 最近客户 -->
            <div class="card">
                <div class="card-header">
                    <span class="card-title">最近客户</span>
                    <a href="/crm" onclick="window.location.href='/crm'; return false;" class="card-action">查看全部 →</a>
                </div>
                <div class="card-body" id="recentCustomers">
                    <div class="loading"><span class="spinner"></span> 加载中...</div>
                </div>
            </div>
            
            <!-- 客户状态分布 -->
            <div class="card">
                <div class="card-header">
                    <span class="card-title">客户状态分布</span>
                    <a href="/analytics" onclick="window.location.href='/analytics'; return false;" class="card-action">详细分析 →</a>
                </div>
                <div class="card-body" id="statusDistribution">
                    <div class="loading"><span class="spinner"></span> 加载中...</div>
                </div>
            </div>
            
            <!-- 7天趋势 -->
            <div class="card">
                <div class="card-header">
                    <span class="card-title">近7天趋势</span>
                </div>
                <div class="card-body" id="trendChart">
                    <div class="loading"><span class="spinner"></span> 加载中...</div>
                </div>
            </div>
            
            <!-- 最近活动 -->
            <div class="card">
                <div class="card-header">
                    <span class="card-title">最近活动</span>
                    <a href="/analytics" onclick="window.location.href='/analytics'; return false;" class="card-action">全部活动 →</a>
                </div>
                <div class="card-body" id="recentActivities">
                    <div class="loading"><span class="spinner"></span> 加载中...</div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const API_BASE = window.location.origin;

        function getToken() {
            return localStorage.getItem('token');
        }

        async function apiFetch(url, options = {}) {
            const token = getToken();
            const headers = {
                'Content-Type': 'application/json',
                ...options.headers
            };
            if (token) {
                headers['Authorization'] = `Bearer ${token}`;
            }

            const response = await fetch(`${API_BASE}${url}`, {
                ...options,
                headers
            });

            if (response.status === 401) {
                localStorage.removeItem('token');
                window.location.href = '/login';
                return null;
            }

            if (!response.ok) {
                const error = await response.json().catch(() => ({ detail: '请求失败' }));
                throw new Error(error.detail || '请求失败');
            }

            return response.json();
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            const date = new Date(dateStr);
            const now = new Date();
            const diff = now - date;
            if (diff < 3600000) {
                const minutes = Math.floor(diff / 60000);
                return minutes <= 0 ? '刚刚' : `${minutes}分钟前`;
            }
            if (diff < 86400000) {
                const hours = Math.floor(diff / 3600000);
                return `${hours}小时前`;
            }
            if (diff < 604800000) {
                const days = Math.floor(diff / 86400000);
                return `${days}天前`;
            }
            return date.toLocaleDateString('zh-CN');
        }

        function getInitials(name) {
            if (!name) return '?';
            const parts = name.trim().split(/\s+/);
            if (parts.length >= 2) {
                return (parts[0][0] + parts[1][0]).toUpperCase();
            }
            return name.substring(0, 2).toUpperCase();
        }

        const STATUS_LABELS = {
            'lead': '潜在客户',
            'contacted': '已联系',
            'quoted': '已报价',
            'negotiating': '谈判中',
            'won': '成交',
            'lost': '已流失',
            'hold': '搁置'
        };

        const STATUS_COLORS = {
            'lead': '#3b82f6',
            'contacted': '#f59e0b',
            'quoted': '#6366f1',
            'negotiating': '#ec4899',
            'won': '#10b981',
            'lost': '#ef4444',
            'hold': '#6b7280'
        };

        // ==================== 问候语 ====================
        function setGreeting() {
            const hour = new Date().getHours();
            let greeting = '';
            if (hour < 6) greeting = '夜深了，注意休息 🌙';
            else if (hour < 12) greeting = '早上好！新的一天加油 ☀️';
            else if (hour < 18) greeting = '下午好！保持专注 💪';
            else greeting = '晚上好！辛苦了 🌆';
            document.getElementById('greeting').textContent = greeting;
        }

        // ==================== 统计卡片 ====================
        async function loadOverview() {
            try {
                const data = await apiFetch('/api/analytics/overview');
                
                const customers = data.customers || {};
                document.getElementById('totalCustomers').textContent = (customers.total || 0).toLocaleString();
                document.getElementById('newThisMonth').textContent = (customers.new_this_month || 0).toLocaleString();
                document.getElementById('todayContacted').textContent = (customers.today_contacted || 0).toLocaleString();

                // Won customers from status distribution
                const statusDist = data.status_distribution || {};
                document.getElementById('wonCustomers').textContent = (statusDist['won'] || statusDist.won || 0).toLocaleString();

                // Render status distribution
                renderStatusDistribution(statusDist, customers.total || 0);
            } catch (e) {
                console.error('Load overview failed:', e);
                document.getElementById('totalCustomers').textContent = '0';
                document.getElementById('newThisMonth').textContent = '0';
                document.getElementById('todayContacted').textContent = '0';
                document.getElementById('wonCustomers').textContent = '0';
                document.getElementById('statusDistribution').innerHTML =
                    '<div class="empty-state"><div class="empty-state-text">暂无数据</div></div>';
            }
        }

        function renderStatusDistribution(statusDist, total) {
            const container = document.getElementById('statusDistribution');
            const entries = Object.entries(statusDist);

            if (entries.length === 0 || total === 0) {
                container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📊</div><div class="empty-state-text">暂无客户数据</div></div>';
                return;
            }

            const html = entries.map(([status, count]) => {
                const pct = total > 0 ? ((count / total) * 100).toFixed(1) : 0;
                const label = STATUS_LABELS[status] || status;
                const color = STATUS_COLORS[status] || '#6b7280';
                return `
                    <div class="status-bar">
                        <div class="status-bar-header">
                            <span class="status-bar-label">${escapeHtml(label)}</span>
                            <span class="status-bar-value">${count} (${pct}%)</span>
                        </div>
                        <div class="status-bar-track">
                            <div class="status-bar-fill" style="width: ${pct}%; background: ${color};"></div>
                        </div>
                    </div>
                `;
            }).join('');

            container.innerHTML = html;
        }

        // ==================== 最近客户 ====================
        async function loadRecentCustomers() {
            const container = document.getElementById('recentCustomers');
            try {
                const data = await apiFetch('/api/crm/contacts');
                const customers = Array.isArray(data) ? data : (data.contacts || []);

                if (customers.length === 0) {
                    container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">👥</div><div class="empty-state-text">暂无客户</div></div>';
                    return;
                }

                // Show only the most recent 5
                const recent = customers.slice(0, 5);
                container.innerHTML = `
                    <ul class="customer-list">
                        ${recent.map(c => `
                            <li class="customer-item">
                                <div class="customer-avatar">${getInitials(c.name)}</div>
                                <div class="customer-info">
                                    <div class="customer-name">${escapeHtml(c.name)}</div>
                                    <div class="customer-company">${escapeHtml(c.company || c.country || '')}</div>
                                </div>
                                <span class="customer-time">${formatDate(c.created_at || c.updated_at)}</span>
                            </li>
                        `).join('')}
                    </ul>
                `;
            } catch (e) {
                container.innerHTML = `<div class="empty-state"><div class="empty-state-text">加载失败</div></div>`;
            }
        }

        // ==================== 最近活动 ====================
        async function loadRecentActivities() {
            const container = document.getElementById('recentActivities');
            try {
                const data = await apiFetch('/api/analytics/activities?limit=8');
                const activities = data.activities || [];

                if (activities.length === 0) {
                    container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📝</div><div class="empty-state-text">暂无活动记录</div></div>';
                    return;
                }

                container.innerHTML = `
                    <ul class="activity-list">
                        ${activities.map(a => {
                            let iconClass = 'create';
                            let icon = '📝';
                            if (a.type === 'update' || a.action === 'update') { iconClass = 'update'; icon = '✏️'; }
                            else if (a.type === 'contact' || a.action === 'contact') { iconClass = 'contact'; icon = '📞'; }
                            else if (a.type === 'create' || a.action === 'create') { iconClass = 'create'; icon = '✨'; }
                            return `
                                <li class="activity-item">
                                    <span class="activity-icon ${iconClass}">${icon}</span>
                                    <span class="activity-text">${escapeHtml(a.description || a.message || a.summary || JSON.stringify(a))}</span>
                                    <span class="activity-time">${formatDate(a.created_at || a.time || a.timestamp)}</span>
                                </li>
                            `;
                        }).join('')}
                    </ul>
                `;
            } catch (e) {
                container.innerHTML = `<div class="empty-state"><div class="empty-state-text">加载失败</div></div>`;
            }
        }

        // ==================== 趋势图 ====================
        async function loadTrends() {
            const container = document.getElementById('trendChart');
            try {
                const data = await apiFetch('/api/analytics/trends?days=7');
                const trends = data.trends || [];

                if (trends.length === 0) {
                    container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📈</div><div class="empty-state-text">暂无趋势数据</div></div>';
                    return;
                }

                const maxNew = Math.max(...trends.map(t => t.new_customers || 0), 1);
                const maxContacted = Math.max(...trends.map(t => t.contacted || 0), 1);
                const maxVal = Math.max(maxNew, maxContacted);

                container.innerHTML = `
                    <div class="trend-chart">
                        ${trends.map(t => {
                            const h1 = Math.max(((t.new_customers || 0) / maxVal) * 130, 2);
                            const h2 = Math.max(((t.contacted || 0) / maxVal) * 130, 2);
                            const dateLabel = (t.date || '').slice(5); // MM-DD
                            return `
                                <div class="trend-bar-wrapper" title="${t.date}: 新增${t.new_customers||0}, 联系${t.contacted||0}">
                                    <div style="display:flex;gap:2px;align-items:flex-end;height:140px;">
                                        <div class="trend-bar" style="height:${h1}px;background:#fbbf24;"></div>
                                        <div class="trend-bar" style="height:${h2}px;background:#3b82f6;"></div>
                                    </div>
                                    <div class="trend-bar-label">${escapeHtml(dateLabel)}</div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                    <div class="trend-legend">
                        <div class="trend-legend-item">
                            <div class="trend-legend-dot" style="background:#fbbf24;"></div>
                            <span>新增客户</span>
                        </div>
                        <div class="trend-legend-item">
                            <div class="trend-legend-dot" style="background:#3b82f6;"></div>
                            <span>联系客户</span>
                        </div>
                    </div>
                `;
            } catch (e) {
                container.innerHTML = `<div class="empty-state"><div class="empty-state-text">加载失败</div></div>`;
            }
        }

        // ==================== Refresh ====================
        function refreshAll() {
            loadOverview();
            loadRecentCustomers();
            loadRecentActivities();
            loadTrends();
        }

        // ==================== Init ====================
        document.addEventListener('DOMContentLoaded', () => {
            if (!getToken()) {
                window.location.href = '/login';
                return;
            }
            setGreeting();
            refreshAll();
        });
    </script>
</body>
</html>
