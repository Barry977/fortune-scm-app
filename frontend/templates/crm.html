<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM 客户管理 - FORTUNE SCM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen" x-data="crmApp()">
    <!-- 导航栏 -->
    <nav class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <h1 class="text-xl font-bold text-gray-800">FORTUNE SCM</h1>
                    <span class="ml-4 text-gray-500">CRM 客户管理</span>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="/dashboard.html" class="text-gray-600 hover:text-gray-900">首页</a>
                    <a href="/analytics.html" class="text-gray-600 hover:text-gray-900">数据分析</a>
                    <button @click="logout()" class="text-gray-600 hover:text-gray-900">退出</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- 统计卡片 -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="bg-white rounded-lg shadow p-6">
                <div class="flex items-center">
                    <div class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center">
                        <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
                        </svg>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm text-gray-500">总客户</p>
                        <p class="text-2xl font-bold text-gray-800" x-text="stats.total_customers"></p>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-lg shadow p-6">
                <div class="flex items-center">
                    <div class="w-12 h-12 bg-green-100 rounded-full flex items-center justify-center">
                        <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm text-gray-500">成交客户</p>
                        <p class="text-2xl font-bold text-gray-800" x-text="stats.by_status.won || 0"></p>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-lg shadow p-6">
                <div class="flex items-center">
                    <div class="w-12 h-12 bg-yellow-100 rounded-full flex items-center justify-center">
                        <svg class="w-6 h-6 text-yellow-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path>
                        </svg>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm text-gray-500">转化率</p>
                        <p class="text-2xl font-bold text-gray-800" x-text="stats.conversion_rate + '%'"></p>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-lg shadow p-6">
                <div class="flex items-center">
                    <div class="w-12 h-12 bg-purple-100 rounded-full flex items-center justify-center">
                        <svg class="w-6 h-6 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm text-gray-500">总收入</p>
                        <p class="text-2xl font-bold text-gray-800" x-text="'$' + stats.total_revenue"></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 操作栏 -->
        <div class="bg-white rounded-lg shadow mb-8">
            <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center flex-wrap gap-4">
                <div class="flex space-x-2">
                    <button @click="showAddModal = true" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md text-sm font-medium">+ 添加客户</button>
                    <button @click="showImportModal = true" class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded-md text-sm font-medium">导入</button>
                </div>
                <div class="flex space-x-2">
                    <input type="text" x-model="searchQuery" @input.debounce.500ms="loadCustomers()" placeholder="搜索客户..." class="px-3 py-2 border border-gray-300 rounded-md text-sm focus:ring-2 focus:ring-blue-500">
                    <select x-model="filterStatus" @change="loadCustomers()" class="px-3 py-2 border border-gray-300 rounded-md text-sm focus:ring-2 focus:ring-blue-500">
                        <option value="">所有状态</option>
                        <option value="lead">潜在客户</option>
                        <option value="contacted">已联系</option>
                        <option value="quoted">已报价</option>
                        <option value="negotiating">谈判中</option>
                        <option value="won">成交</option>
                        <option value="lost">流失</option>
                    </select>
                    <select x-model="filterPriority" @change="loadCustomers()" class="px-3 py-2 border border-gray-300 rounded-md text-sm focus:ring-2 focus:ring-blue-500">
                        <option value="">所有优先级</option>
                        <option value="high">高</option>
                        <option value="medium">中</option>
                        <option value="low">低</option>
                    </select>
                </div>
            </div>

            <!-- 客户列表 -->
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">客户</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">公司</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">状态</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">优先级</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">国家</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">来源</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">最后联系</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">操作</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                        <template x-for="customer in customers" :key="customer.id">
                            <tr class="hover:bg-gray-50 cursor-pointer" @click="viewCustomer(customer)">
                                <td class="px-6 py-4 whitespace-nowrap">
                                    <div class="text-sm font-medium text-gray-900" x-text="customer.name"></div>
                                    <div class="text-sm text-gray-500" x-text="customer.email"></div>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" x-text="customer.company || '-'"></td>
                                <td class="px-6 py-4 whitespace-nowrap">
                                    <span :class="getStatusClass(customer.status)" class="px-2 py-1 text-xs font-medium rounded-full" x-text="getStatusLabel(customer.status)"></span>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap">
                                    <span :class="getPriorityClass(customer.priority)" class="px-2 py-1 text-xs font-medium rounded-full" x-text="getPriorityLabel(customer.priority)"></span>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" x-text="customer.country || '-'"></td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" x-text="getSourceLabel(customer.source)"></td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" x-text="customer.last_contact_at ? new Date(customer.last_contact_at).toLocaleDateString() : '从未'"></td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium space-x-2">
                                    <button @click.stop="editCustomer(customer)" class="text-blue-600 hover:text-blue-900">编辑</button>
                                    <button @click.stop="deleteCustomer(customer.id)" class="text-red-600 hover:text-red-900">删除</button>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 待办跟进 -->
        <div class="bg-white rounded-lg shadow">
            <div class="px-6 py-4 border-b border-gray-200">
                <h2 class="text-lg font-medium text-gray-800">待办跟进</h2>
            </div>
            <div class="p-6">
                <div class="space-y-3">
                    <template x-for="followup in pendingFollowups" :key="followup.id">
                        <div class="flex items-center justify-between p-4 border border-gray-200 rounded-lg">
                            <div>
                                <p class="text-sm font-medium text-gray-800" x-text="followup.content"></p>
                                <p class="text-sm text-gray-500" x-text="getFollowupTypeLabel(followup.type) + ' - ' + new Date(followup.scheduled_at || followup.created_at).toLocaleString()"></p>
                            </div>
                            <button @click="completeFollowup(followup.id)" class="text-green-600 hover:text-green-900 text-sm font-medium">完成</button>
                        </div>
                    </template>
                    <div x-show="pendingFollowups.length === 0" class="text-center text-gray-500 py-8">
                        暂无待办跟进
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 添加/编辑客户模态框 -->
    <div x-show="showAddModal || showEditModal" x-cloak class="fixed inset-0 bg-gray-500 bg-opacity-75 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-xl max-w-2xl w-full mx-4 p-6 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-medium text-gray-800" x-text="showEditModal ? '编辑客户' : '添加客户'"></h3>
                <button @click="closeModal()" class="text-gray-400 hover:text-gray-600">×</button>
            </div>
            <form @submit.prevent="saveCustomer()" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">姓名 *</label>
                        <input type="text" x-model="form.name" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">公司</label>
                        <input type="text" x-model="form.company" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">邮箱</label>
                        <input type="email" x-model="form.email" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">电话</label>
                        <input type="text" x-model="form.phone" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">国家</label>
                        <input type="text" x-model="form.country" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">城市</label>
                        <input type="text" x-model="form.city" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">行业</label>
                        <input type="text" x-model="form.industry" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">来源</label>
                        <select x-model="form.source" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500">
                            <option value="linkedin">LinkedIn</option>
                            <option value="email">邮件</option>
                            <option value="phone">电话</option>
                            <option value="website">网站</option>
                            <option value="referral">推荐</option>
                            <option value="trade_show">展会</option>
                            <option value="cold_call">陌拜</option>
                            <option value="other">其他</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">状态</label>
                        <select x-model="form.status" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500">
                            <option value="lead">潜在客户</option>
                            <option value="contacted">已联系</option>
                            <option value="quoted">已报价</option>
                            <option value="negotiating">谈判中</option>
                            <option value="won">成交</option>
                            <option value="lost">流失</option>
                            <option value="hold">搁置</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">优先级</label>
                        <select x-model="form.priority" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500">
                            <option value="high">高</option>
                            <option value="medium">中</option>
                            <option value="low">低</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">LinkedIn</label>
                    <input type="url" x-model="form.linkedin_url" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">网站</label>
                    <input type="url" x-model="form.website" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">备注</label>
                    <textarea x-model="form.notes" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500"></textarea>
                </div>
                <div class="flex justify-end space-x-3">
                    <button type="button" @click="closeModal()" class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50">取消</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">保存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 客户详情模态框 -->
    <div x-show="showDetailModal" x-cloak class="fixed inset-0 bg-gray-500 bg-opacity-75 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-xl max-w-4xl w-full mx-4 p-6 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-medium text-gray-800" x-text="selectedCustomer?.name"></h3>
                <button @click="showDetailModal = false" class="text-gray-400 hover:text-gray-600">×</button>
            </div>
            <div x-show="selectedCustomer" class="space-y-6">
                <!-- 基本信息 -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="bg-gray-50 p-4 rounded-lg">
                        <p class="text-sm text-gray-500">公司</p>
                        <p class="text-sm font-medium text-gray-800" x-text="selectedCustomer?.company || '-'"></p>
                    </div>
                    <div class="bg-gray-50 p-4 rounded-lg">
                        <p class="text-sm text-gray-500">邮箱</p>
                        <p class="text-sm font-medium text-gray-800" x-text="selectedCustomer?.email || '-'"></p>
                    </div>
                    <div class="bg-gray-50 p-4 rounded-lg">
                        <p class="text-sm text-gray-500">电话</p>
                        <p class="text-sm font-medium text-gray-800" x-text="selectedCustomer?.phone || '-'"></p>
                    </div>
                </div>

                <!-- 跟进记录 -->
                <div>
                    <div class="flex justify-between items-center mb-4">
                        <h4 class="text-md font-medium text-gray-800">跟进记录</h4>
                        <button @click="showFollowupModal = true" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded-md text-sm">+ 添加跟进</button>
                    </div>
                    <div class="space-y-3">
                        <template x-for="followup in customerFollowups" :key="followup.id">
                            <div class="p-4 border border-gray-200 rounded-lg">
                                <div class="flex justify-between items-start">
                                    <div>
                                        <span class="inline-block px-2 py-1 text-xs font-medium bg-gray-100 text-gray-800 rounded-full mb-2" x-text="getFollowupTypeLabel(followup.type)"></span>
                                        <p class="text-sm text-gray-700" x-text="followup.content"></p>
                                    </div>
                                    <span class="text-xs text-gray-500" x-text="new Date(followup.created_at).toLocaleString()"></span>
                                </div>
                                <div x-show="followup.outcome" class="mt-2 text-sm text-gray-500">
                                    结果: <span x-text="followup.outcome"></span>
                                </div>
                            </div>
                        </template>
                        <div x-show="customerFollowups.length === 0" class="text-center text-gray-500 py-4">
                            暂无跟进记录
                        </div>
                    </div>
                </div>

                <!-- 报价记录 -->
                <div>
                    <div class="flex justify-between items-center mb-4">
                        <h4 class="text-md font-medium text-gray-800">报价记录</h4>
                        <button @click="showQuoteModal = true" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded-md text-sm">+ 添加报价</button>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-4 py-2 text-left text-xs font-medium text-gray-500">报价单号</th>
                                    <th class="px-4 py-2 text-left text-xs font-medium text-gray-500">金额</th>
                                    <th class="px-4 py-2 text-left text-xs font-medium text-gray-500">状态</th>
                                    <th class="px-4 py-2 text-left text-xs font-medium text-gray-500">创建时间</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-200">
                                <template x-for="quote in customerQuotes" :key="quote.id">
                                    <tr>
                                        <td class="px-4 py-2 text-sm text-gray-900" x-text="quote.quote_number"></td>
                                        <td class="px-4 py-2 text-sm text-gray-500" x-text="quote.currency + ' ' + quote.total"></td>
                                        <td class="px-4 py-2">
                                            <span :class="getQuoteStatusClass(quote.status)" class="px-2 py-1 text-xs font-medium rounded-full" x-text="quote.status"></span>
                                        </td>
                                        <td class="px-4 py-2 text-sm text-gray-500" x-text="new Date(quote.created_at).toLocaleDateString()"></td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                        <div x-show="customerQuotes.length === 0" class="text-center text-gray-500 py-4">
                            暂无报价记录
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 添加跟进模态框 -->
    <div x-show="showFollowupModal" x-cloak class="fixed inset-0 bg-gray-500 bg-opacity-75 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-xl max-w-lg w-full mx-4 p-6">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-medium text-gray-800">添加跟进记录</h3>
                <button @click="showFollowupModal = false" class="text-gray-400 hover:text-gray-600">×</button>
            </div>
            <form @submit.prevent="saveFollowup()" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">类型</label>
                    <select x-model="followupForm.type" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500">
                        <option value="call">电话</option>
                        <option value="email">邮件</option>
                        <option value="meeting">会议</option>
                        <option value="linkedin">LinkedIn</option>
                        <option value="quote">报价</option>
                        <option value="note">备注</option>
                        <option value="other">其他</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">内容</label>
                    <textarea x-model="followupForm.content" required rows="4" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">结果</label>
                    <input type="text" x-model="followupForm.outcome" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">下次行动</label>
                    <input type="text" x-model="followupForm.next_action" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">下次行动日期</label>
                    <input type="date" x-model="followupForm.next_action_date" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="flex justify-end space-x-3">
                    <button type="button" @click="showFollowupModal = false" class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50">取消</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">保存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 错误提示 -->
    <div x-show="error" x-cloak class="fixed bottom-4 right-4 p-4 bg-red-100 border border-red-400 text-red-700 rounded-md shadow-lg">
        <span x-text="error"></span>
        <button @click="error = null" class="ml-2 text-red-500 hover:text-red-700">×</button>
    </div>

    <script>
        function crmApp() {
            return {
                loading: false,
                error: null,
                showAddModal: false,
                showEditModal: false,
                showDetailModal: false,
                showFollowupModal: false,
                showQuoteModal: false,
                showImportModal: false,
                customers: [],
                stats: {
                    total_customers: 0,
                    by_status: {},
                    by_source: {},
                    conversion_rate: 0,
                    total_revenue: 0
                },
                pendingFollowups: [],
                selectedCustomer: null,
                customerFollowups: [],
                customerQuotes: [],
                searchQuery: '',
                filterStatus: '',
                filterPriority: '',
                form: {
                    id: null,
                    name: '',
                    company: '',
                    email: '',
                    phone: '',
                    country: '',
                    city: '',
                    industry: '',
                    source: 'other',
                    status: 'lead',
                    priority: 'medium',
                    tags: [],
                    notes: '',
                    linkedin_url: '',
                    website: ''
                },
                followupForm: {
                    type: 'call',
                    content: '',
                    outcome: '',
                    next_action: '',
                    next_action_date: ''
                },

                async init() {
                    await this.loadCustomers();
                    await this.loadStats();
                    await this.loadPendingFollowups();
                },

                async loadCustomers() {
                    try {
                        const params = new URLSearchParams();
                        if (this.searchQuery) params.append('search', this.searchQuery);
                        if (this.filterStatus) params.append('status', this.filterStatus);
                        if (this.filterPriority) params.append('priority', this.filterPriority);
                        
                        const response = await fetch(`/api/crm/customers?${params}`, {
                            headers: { 'Authorization': `Bearer ${localStorage.getItem('access_token')}` }
                        });
                        if (response.ok) {
                            this.customers = await response.json();
                        }
                    } catch (e) {
                        console.error('加载客户失败:', e);
                    }
                },

                async loadStats() {
                    try {
                        const response = await fetch('/api/crm/stats', {
                            headers: { 'Authorization': `Bearer ${localStorage.getItem('access_token')}` }
                        });
                        if (response.ok) {
                            this.stats = await response.json();
                        }
                    } catch (e) {
                        console.error('加载统计失败:', e);
                    }
                },

                async loadPendingFollowups() {
                    try {
                        const response = await fetch('/api/crm/followups/pending', {
                            headers: { 'Authorization': `Bearer ${localStorage.getItem('access_token')}` }
                        });
                        if (response.ok) {
                            this.pendingFollowups = await response.json();
                        }
                    } catch (e) {
                        console.error('加载待办失败:', e);
                    }
                },

                async viewCustomer(customer) {
                    this.selectedCustomer = customer;
                    this.showDetailModal = true;
                    await this.loadCustomerFollowups(customer.id);
                    await this.loadCustomerQuotes(customer.id);
                },

                async loadCustomerFollowups(customerId) {
                    try {
                        const response = await fetch(`/api/crm/customers/${customerId}/followups`, {
                            headers: { 'Authorization': `Bearer ${localStorage.getItem('access_token')}` }
                        });
                        if (response.ok) {
                            this.customerFollowups = await response.json();
                        }
                    } catch (e) {
                        console.error('加载跟进记录失败:', e);
                    }
                },

                async loadCustomerQuotes(customerId) {
                    try {
                        const response = await fetch(`/api/crm/customers/${customerId}/quotes`, {
                            headers: { 'Authorization': `Bearer ${localStorage.getItem('access_token')}` }
                        });
                        if (response.ok) {
                            this.customerQuotes = await response.json();
                        }
                    } catch (e) {
                        console.error('加载报价失败:', e);
                    }
                },

                editCustomer(customer) {
                    this.form = { ...customer };
                    this.showEditModal = true;
                },

                closeModal() {
                    this.showAddModal = false;
                    this.showEditModal = false;
                    this.form = {
                        id: null,
                        name: '',
                        company: '',
                        email: '',
                        phone: '',
                        country: '',
                        city: '',
                        industry: '',
                        source: 'other',
                        status: 'lead',
                        priority: 'medium',
                        tags: [],
                        notes: '',
                        linkedin_url: '',
                        website: ''
                    };
                },

                async saveCustomer() {
                    this.loading = true;
                    this.error = null;
                    try {
                        const url = this.showEditModal ? `/api/crm/customers/${this.form.id}` : '/api/crm/customers';
                        const method = this.showEditModal ? 'PUT' : 'POST';
                        const response = await fetch(url, {
                            method,
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${localStorage.getItem('access_token')}`
                            },
                            body: JSON.stringify(this.form)
                        });
                        const data = await response.json();
                        if (response.ok) {
                            await this.loadCustomers();
                            await this.loadStats();
                            this.closeModal();
                        } else {
                            this.error = data.detail || '保存失败';
                        }
                    } catch (e) {
                        this.error = '网络错误: ' + e.message;
                    } finally {
                        this.loading = false;
                    }
                },

                async deleteCustomer(id) {
                    if (!confirm('确定要删除这个客户吗？')) return;
                    try {
                        const response = await fetch(`/api/crm/customers/${id}`, {
                            method: 'DELETE',
                            headers: { 'Authorization': `Bearer ${localStorage.getItem('access_token')}` }
                        });
                        if (response.ok) {
                            await this.loadCustomers();
                            await this.loadStats();
                        } else {
                            const data = await response.json();
                            this.error = data.detail || '删除失败';
                        }
                    } catch (e) {
                        this.error = '网络错误: ' + e.message;
                    }
                },

                async saveFollowup() {
                    this.loading = true;
                    this.error = null;
                    try {
                        const response = await fetch(`/api/crm/customers/${this.selectedCustomer.id}/followups`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${localStorage.getItem('access_token')}`
                            },
                            body: JSON.stringify(this.followupForm)
                        });
                        const data = await response.json();
                        if (response.ok) {
                            await this.loadCustomerFollowups(this.selectedCustomer.id);
                            await this.loadPendingFollowups();
                            this.showFollowupModal = false;
                            this.followupForm = { type: 'call', content: '', outcome: '', next_action: '', next_action_date: '' };
                        } else {
                            this.error = data.detail || '保存失败';
                        }
                    } catch (e) {
                        this.error = '网络错误: ' + e.message;
                    } finally {
                        this.loading = false;
                    }
                },

                async completeFollowup(id) {
                    try {
                        const response = await fetch(`/api/crm/followups/${id}/complete`, {
                            method: 'POST',
                            headers: { 'Authorization': `Bearer ${localStorage.getItem('access_token')}` }
                        });
                        if (response.ok) {
                            await this.loadPendingFollowups();
                        }
                    } catch (e) {
                        console.error('完成跟进失败:', e);
                    }
                },

                getStatusClass(status) {
                    const classes = {
                        lead: 'bg-gray-100 text-gray-800',
                        contacted: 'bg-blue-100 text-blue-800',
                        quoted: 'bg-yellow-100 text-yellow-800',
                        negotiating: 'bg-orange-100 text-orange-800',
                        won: 'bg-green-100 text-green-800',
                        lost: 'bg-red-100 text-red-800',
                        hold: 'bg-purple-100 text-purple-800'
                    };
                    return classes[status] || 'bg-gray-100 text-gray-800';
                },

                getStatusLabel(status) {
                    const labels = {
                        lead: '潜在客户',
                        contacted: '已联系',
                        quoted: '已报价',
                        negotiating: '谈判中',
                        won: '成交',
                        lost: '流失',
                        hold: '搁置'
                    };
                    return labels[status] || status;
                },

                getPriorityClass(priority) {
                    const classes = {
                        high: 'bg-red-100 text-red-800',
                        medium: 'bg-yellow-100 text-yellow-800',
                        low: 'bg-green-100 text-green-800'
                    };
                    return classes[priority] || 'bg-gray-100 text-gray-800';
                },

                getPriorityLabel(priority) {
                    const labels = { high: '高', medium: '中', low: '低' };
                    return labels[priority] || priority;
                },

                getSourceLabel(source) {
                    const labels = {
                        linkedin: 'LinkedIn',
                        email: '邮件',
                        phone: '电话',
                        website: '网站',
                        referral: '推荐',
                        trade_show: '展会',
                        cold_call: '陌拜',
                        other: '其他'
                    };
                    return labels[source] || source;
                },

                getFollowupTypeLabel(type) {
                    const labels = {
                        call: '电话',
                        email: '邮件',
                        meeting: '会议',
                        linkedin: 'LinkedIn',
                        quote: '报价',
                        note: '备注',
                        other: '其他'
                    };
                    return labels[type] || type;
                },

                getQuoteStatusClass(status) {
                    const classes = {
                        draft: 'bg-gray-100 text-gray-800',
                        sent: 'bg-blue-100 text-blue-800',
                        accepted: 'bg-green-100 text-green-800',
                        rejected: 'bg-red-100 text-red-800',
                        expired: 'bg-yellow-100 text-yellow-800'
                    };
                    return classes[status] || 'bg-gray-100 text-gray-800';
                },

                logout() {
                    localStorage.clear();
                    window.location.href = '/login.html';
                }
            }
        }
    </script>
</body>
</html>
