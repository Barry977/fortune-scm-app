<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设置 - 命运 DESTINY</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #ffffff; color: #1a1a1a; display: flex; min-height: 100vh; }

        /* Sidebar */
        .sidebar { width: 240px; background: #1a1a1a; color: #ffffff; display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-logo { padding: 24px 20px; display: flex; align-items: center; gap: 12px; }
        .sidebar-logo svg { width: 36px; height: 36px; }
        .sidebar-logo .logo-text { font-size: 18px; font-weight: 700; letter-spacing: 2px; }
        .sidebar-logo .logo-sub { font-size: 10px; color: #999; letter-spacing: 3px; }
        .nav-section { padding: 16px 12px 8px; }
        .nav-section-title { font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: 1px; padding: 0 8px; margin-bottom: 8px; }
        .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; cursor: pointer; color: #aaa; text-decoration: none; font-size: 14px; transition: all .15s; position: relative; }
        .nav-item:hover { background: #2a2a2a; color: #fff; }
        .nav-item.active { background: #fbbf24; color: #1a1a1a; font-weight: 600; }
        .nav-item .badge { background: #fbbf24; color: #1a1a1a; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; margin-left: auto; }
        .nav-item.active .badge { background: #1a1a1a; color: #fbbf24; }
        .sidebar-footer { margin-top: auto; padding: 16px; border-top: 1px solid #333; display: flex; align-items: center; gap: 10px; }
        .sidebar-footer .avatar { width: 32px; height: 32px; border-radius: 50%; background: #fbbf24; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: #1a1a1a; }
        .sidebar-footer .user-info { font-size: 13px; }
        .sidebar-footer .user-info .role { font-size: 11px; color: #666; }

        /* Main */
        .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .topbar { padding: 20px 32px; border-bottom: 1px solid #f5f5f5; }
        .topbar h1 { font-size: 22px; font-weight: 700; }
        .content { flex: 1; overflow-y: auto; padding: 24px 32px 40px; max-width: 800px; }

        /* Sections */
        .settings-section { margin-bottom: 32px; }
        .settings-section h2 { font-size: 16px; font-weight: 700; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 2px solid #fbbf24; display: inline-block; }
        .form-row { display: flex; align-items: center; margin-bottom: 14px; gap: 12px; }
        .form-row label { width: 120px; font-size: 14px; color: #555; flex-shrink: 0; text-align: right; }
        .form-row input, .form-row select { flex: 1; max-width: 360px; padding: 9px 12px; border: 1px solid #e5e5e5; border-radius: 6px; font-size: 14px; outline: none; transition: border .15s; background: #fff; }
        .form-row input:focus, .form-row select:focus { border-color: #fbbf24; }
        .form-row .hint { font-size: 12px; color: #999; margin-left: 8px; }
        .btn { padding: 8px 20px; border: none; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s; }
        .btn-primary { background: #fbbf24; color: #1a1a1a; }
        .btn-primary:hover { background: #f59e0b; }
        .btn-secondary { background: #f5f5f5; color: #1a1a1a; }
        .btn-secondary:hover { background: #e5e5e5; }
        .btn-danger { background: #fee2e2; color: #dc2626; }
        .btn-danger:hover { background: #fecaca; }
        .form-actions { margin-left: 132px; display: flex; gap: 8px; margin-top: 6px; }

        /* Toggle */
        .toggle-row { display: flex; align-items: center; margin-bottom: 14px; gap: 12px; }
        .toggle-row label { width: 120px; font-size: 14px; color: #555; text-align: right; flex-shrink: 0; }
        .toggle { width: 44px; height: 24px; background: #ddd; border-radius: 12px; position: relative; cursor: pointer; transition: background .2s; }
        .toggle.on { background: #fbbf24; }
        .toggle::after { content: ''; width: 20px; height: 20px; background: #fff; border-radius: 50%; position: absolute; top: 2px; left: 2px; transition: left .2s; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
        .toggle.on::after { left: 22px; }

        /* Proxy status */
        .proxy-status { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 4px 12px; border-radius: 12px; background: #f0fdf4; color: #16a34a; }
        .proxy-status .dot { width: 8px; height: 8px; border-radius: 50%; background: #16a34a; }
        .proxy-status.offline { background: #fef2f2; color: #dc2626; }
        .proxy-status.offline .dot { background: #dc2626; }

        /* User table */
        .user-table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        .user-table th, .user-table td { padding: 10px 14px; text-align: left; font-size: 13px; border-bottom: 1px solid #f5f5f5; }
        .user-table th { font-weight: 600; color: #888; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
        .user-table tr:hover td { background: #fafafa; }
        .role-badge { padding: 3px 10px; border-radius: 10px; font-size: 12px; font-weight: 600; }
        .role-badge.admin { background: #fef3c7; color: #92400e; }
        .role-badge.editor { background: #dbeafe; color: #1e40af; }
        .role-badge.viewer { background: #f3f4f6; color: #374151; }
        .table-actions { display: flex; gap: 6px; }
        .table-actions .btn { padding: 4px 12px; font-size: 12px; }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <nav class="sidebar">
        <div class="sidebar-logo">
            <svg viewBox="0 0 36 36" fill="none">
                <path d="M4 28L18 4L32 28" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M8 22H28" stroke="#666" stroke-width="1.5"/>
                <path d="M11 16H25" stroke="#444" stroke-width="1"/>
                <circle cx="18" cy="10" r="3" fill="#fbbf24"/>
            </svg>
            <div>
                <div class="logo-text">命运</div>
                <div class="logo-sub">DESTINY</div>
            </div>
        </div>

        <div class="nav-section">
            <div class="nav-section-title">主菜单</div>
            <a href="/dashboard" class="nav-item">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                控制面板
            </a>
            <a href="/crm" class="nav-item">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                客户管理
                <span class="badge">128</span>
            </a>
            <a href="/linkedin" class="nav-item">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>
                LinkedIn
            </a>
            <a href="/email" class="nav-item">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                邮件营销
            </a>
        </div>

        <div class="nav-section">
            <div class="nav-section-title">自动化</div>
            <a href="/scheduler" class="nav-item">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                定时任务
            </a>
            <a href="/materials" class="nav-item">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                素材库
            </a>
        </div>

        <div class="nav-section">
            <div class="nav-section-title">系统</div>
            <a href="/analytics" class="nav-item">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                数据分析
            </a>
            <a href="/ai_config" class="nav-item">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>
                AI配置
            </a>
            <a href="/settings" class="nav-item active">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                设置
            </a>
        </div>

        <div class="sidebar-footer">
            <div class="avatar">A</div>
            <div class="user-info">
                <div>Admin</div>
                <div class="role">管理员</div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main">
        <div class="topbar">
            <h1>设置</h1>
        </div>
        <div class="content">

            <!-- 账户设置 -->
            <div class="settings-section">
                <h2>账户设置</h2>
                <div class="form-row">
                    <label>用户名</label>
                    <input type="text" value="admin" />
                </div>
                <div class="form-row">
                    <label>邮箱</label>
                    <input type="email" value="admin@destiny.com" />
                </div>
                <div class="form-row">
                    <label>新密码</label>
                    <input type="password" placeholder="留空则不修改" />
                </div>
                <div class="form-row">
                    <label>确认密码</label>
                    <input type="password" placeholder="再次输入新密码" />
                </div>
                <div class="form-actions">
                    <button class="btn btn-primary">保存更改</button>
                </div>
            </div>

            <!-- 代理设置 -->
            <div class="settings-section">
                <h2>代理设置</h2>
                <div class="form-row">
                    <label>代理状态</label>
                    <span class="proxy-status"><span class="dot"></span>已连接 · 自动检测系统 VPN</span>
                </div>
                <div class="form-row">
                    <label>当前 IP</label>
                    <input type="text" value="203.0.113.42 (美国 · 加利福尼亚)" readonly style="background:#fafafa;color:#666;" />
                </div>
                <div class="form-row">
                    <label>代理模式</label>
                    <select>
                        <option selected>自动检测系统代理</option>
                        <option>手动配置</option>
                        <option>直连（不使用代理）</option>
                    </select>
                </div>
                <div class="form-row" id="manualProxy" style="display:none;">
                    <label>代理地址</label>
                    <input type="text" placeholder="http://127.0.0.1:7890" />
                </div>
                <div class="form-actions">
                    <button class="btn btn-secondary" onclick="testProxy()">测试连接</button>
                    <button class="btn btn-primary">保存</button>
                </div>
            </div>

            <!-- AI 模型配置 -->
            <div class="settings-section">
                <h2>AI 模型配置</h2>
                <div class="form-row">
                    <label>模型供应商</label>
                    <select id="aiProvider">
                        <option value="openai">OpenAI</option>
                        <option value="claude">Claude (Anthropic)</option>
                        <option value="ollama">Ollama (本地)</option>
                        <option value="vllm">vLLM</option>
                        <option value="deepseek">DeepSeek</option>
                        <option value="qwen">通义千问</option>
                    </select>
                </div>
                <div class="form-row">
                    <label>模型名称</label>
                    <input type="text" id="aiModel" value="gpt-4o" />
                    <span class="hint">例如 gpt-4o, claude-3.5-sonnet, llama3</span>
                </div>
                <div class="form-row">
                    <label>API Key</label>
                    <input type="password" id="aiApiKey" placeholder="sk-..." />
                </div>
                <div class="form-row">
                    <label>API 地址</label>
                    <input type="text" id="aiBaseUrl" value="https://api.openai.com/v1" />
                    <span class="hint">本地模型填写 http://localhost:11434</span>
                </div>
                <div class="form-actions">
                    <button class="btn btn-secondary" onclick="testAI()">测试连接</button>
                    <button class="btn btn-primary">保存配置</button>
                </div>
                <div id="aiTestResult" style="margin-left:132px;margin-top:10px;font-size:13px;display:none;"></div>
            </div>

            <!-- 通知设置 -->
            <div class="settings-section">
                <h2>通知设置</h2>
                <div class="toggle-row">
                    <label>邮件通知</label>
                    <div class="toggle on" onclick="this.classList.toggle('on')"></div>
                    <span style="font-size:13px;color:#888;">开启后将通过邮件接收系统通知</span>
                </div>
                <div class="toggle-row">
                    <label>任务完成通知</label>
                    <div class="toggle on" onclick="this.classList.toggle('on')"></div>
                </div>
                <div class="toggle-row">
                    <label>异常告警</label>
                    <div class="toggle on" onclick="this.classList.toggle('on')"></div>
                </div>
                <div class="form-row">
                    <label>通知频率</label>
                    <select>
                        <option>实时</option>
                        <option selected>每小时汇总</option>
                        <option>每日汇总</option>
                        <option>每周汇总</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button class="btn btn-primary">保存</button>
                </div>
            </div>

            <!-- 用户管理 -->
            <div class="settings-section">
                <h2>用户管理</h2>
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
                    <span style="font-size:13px;color:#888;" id="userCount">加载中...</span>
                    <button class="btn btn-primary" onclick="openUserModal()">+ 添加用户</button>
                </div>
                <table class="user-table">
                    <thead>
                        <tr>
                            <th>用户名</th>
                            <th>邮箱</th>
                            <th>角色</th>
                            <th>状态</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody">
                        <tr><td colspan="5" style="text-align:center;color:#999;padding:20px;">加载中...</td></tr>
                    </tbody>
                </table>
            </div>

            <!-- 用户模态框 -->
            <div id="userModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center;">
                <div style="background:white;border-radius:12px;padding:24px;width:420px;max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.3);">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
                        <h3 id="userModalTitle" style="font-size:16px;font-weight:700;">添加用户</h3>
                        <span style="cursor:pointer;font-size:20px;color:#999;" onclick="closeUserModal()">&times;</span>
                    </div>
                    <form id="userForm" onsubmit="saveUser(event)">
                        <input type="hidden" id="editUserId">
                        <div class="form-row">
                            <label>用户名</label>
                            <input type="text" id="userUsername" required minlength="3" maxlength="50" pattern="[a-zA-Z0-9_]+" placeholder="字母、数字、下划线" />
                        </div>
                        <div class="form-row">
                            <label>邮箱</label>
                            <input type="email" id="userEmail" placeholder="user@example.com" />
                        </div>
                        <div class="form-row" id="passwordRow">
                            <label>密码</label>
                            <input type="password" id="userPassword" minlength="6" placeholder="至少6位" />
                        </div>
                        <div class="form-row">
                            <label>角色</label>
                            <select id="userRole">
                                <option value="subaccount">子账号</option>
                            </select>
                        </div>
                        <div class="form-row">
                            <label>状态</label>
                            <select id="userStatus">
                                <option value="active">启用</option>
                                <option value="disabled">禁用</option>
                            </select>
                        </div>
                        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px;">
                            <button type="button" class="btn btn-secondary" onclick="closeUserModal()">取消</button>
                            <button type="submit" class="btn btn-primary" id="userSubmitBtn">创建</button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>

    <script>
        function getToken() { return localStorage.getItem('token') || ''; }
        function authHeaders(method) {
            return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + getToken() };
        }
        async function apiFetch(url, method, body) {
            const opts = { method, headers: authHeaders(method) };
            if (body) opts.body = JSON.stringify(body);
            const r = await fetch(url, opts);
            if (!r.ok) { const t = await r.text(); throw new Error(`HTTP ${r.status}: ${t}`); }
            return r.json();
        }
        function showToast(msg, type) {
            const t = document.createElement('div');
            t.style.cssText = 'position:fixed;top:20px;right:20px;padding:12px 20px;border-radius:8px;font-size:14px;z-index:9999;color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.15);';
            t.style.background = type === 'error' ? '#dc2626' : '#16a34a';
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        // ── 用户管理 ──
        const roleLabels = { admin: '管理员', subaccount: '子账号' };
        const roleBadgeCls = { admin: 'admin', subaccount: 'editor' };

        async function loadUsers() {
            try {
                const users = await apiFetch('/api/users');
                const tbody = document.getElementById('userTableBody');
                document.getElementById('userCount').textContent = `共 ${users.length} 个用户`;
                if (!users.length) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#999;padding:20px;">暂无用户</td></tr>';
                    return;
                }
                tbody.innerHTML = users.map(u => {
                    const isActive = u.status === 'active';
                    const statusColor = isActive ? '#16a34a' : '#999';
                    const statusText = isActive ? '● 启用' : '● 禁用';
                    const badge = roleBadgeCls[u.role] || 'viewer';
                    const label = roleLabels[u.role] || u.role;
                    return `<tr>
                        <td style="font-weight:600;">${u.username}</td>
                        <td>${u.email || '-'}</td>
                        <td><span class="role-badge ${badge}">${label}</span></td>
                        <td style="color:${statusColor};cursor:pointer;" onclick="toggleUser(${u.id})" title="点击切换状态">${statusText}</td>
                        <td><div class="table-actions">
                            <button class="btn btn-secondary" onclick='editUser(${JSON.stringify(u)})'>编辑</button>
                            <button class="btn btn-danger" onclick="deleteUser(${u.id}, '${u.username}')">删除</button>
                        </div></td>
                    </tr>`;
                }).join('');
            } catch (e) {
                console.error('loadUsers error:', e);
                document.getElementById('userCount').textContent = '加载失败';
            }
        }

        function openUserModal(user) {
            const modal = document.getElementById('userModal');
            document.getElementById('editUserId').value = user ? user.id : '';
            document.getElementById('userUsername').value = user ? user.username : '';
            document.getElementById('userEmail').value = user ? (user.email || '') : '';
            document.getElementById('userPassword').value = '';
            document.getElementById('userRole').value = user ? user.role : 'subaccount';
            document.getElementById('userStatus').value = user ? user.status : 'active';
            document.getElementById('userModalTitle').textContent = user ? '编辑用户' : '添加用户';
            document.getElementById('userSubmitBtn').textContent = user ? '保存' : '创建';
            document.getElementById('passwordRow').style.display = '';
            document.getElementById('userPassword').required = !user;
            document.getElementById('userPassword').placeholder = user ? '留空则不修改' : '至少6位';
            if (user) document.getElementById('userUsername').disabled = true;
            else document.getElementById('userUsername').disabled = false;
            modal.style.display = 'flex';
        }

        function closeUserModal() {
            document.getElementById('userModal').style.display = 'none';
            document.getElementById('userForm').reset();
        }

        function editUser(user) { openUserModal(user); }

        async function saveUser(e) {
            e.preventDefault();
            const id = document.getElementById('editUserId').value;
            const username = document.getElementById('userUsername').value;
            const email = document.getElementById('userEmail').value;
            const password = document.getElementById('userPassword').value;
            const role = document.getElementById('userRole').value;
            const status = document.getElementById('userStatus').value;

            try {
                if (id) {
                    // Update
                    const body = { email, role, status };
                    if (password) body.password = password;
                    await apiFetch(`/api/users/${id}`, 'PUT', body);
                    showToast('用户已更新');
                } else {
                    // Create
                    await apiFetch('/api/users', 'POST', { username, email, password, role, status });
                    showToast('用户已创建');
                }
                closeUserModal();
                loadUsers();
            } catch (e) {
                showToast('操作失败: ' + e.message, 'error');
            }
        }

        async function deleteUser(id, name) {
            if (!confirm(`确定要删除用户 "${name}" 吗？`)) return;
            try {
                await apiFetch(`/api/users/${id}`, 'DELETE');
                showToast('用户已删除');
                loadUsers();
            } catch (e) {
                showToast('删除失败: ' + e.message, 'error');
            }
        }

        async function toggleUser(id) {
            try {
                // Use PUT /api/users/{id} to toggle status
                const users = await apiFetch('/api/users');
                const user = users.find(u => u.id === id);
                if (!user) return;
                const newStatus = user.status === 'active' ? 'disabled' : 'active';
                await apiFetch(`/api/users/${id}`, 'PUT', { status: newStatus });
                showToast(newStatus === 'active' ? '用户已启用' : '用户已禁用');
                loadUsers();
            } catch (e) {
                showToast('切换失败: ' + e.message, 'error');
            }
        }

        // 点击模态框外部关闭
        document.getElementById('userModal').addEventListener('click', function(e) {
            if (e.target === this) closeUserModal();
        });

        function testProxy() {
            const status = document.querySelector('.proxy-status');
            status.innerHTML = '<span class="dot"></span>测试中...';
            setTimeout(() => {
                status.innerHTML = '<span class="dot"></span>连接正常 · 延迟 128ms';
            }, 1500);
        }

        function testAI() {
            const el = document.getElementById('aiTestResult');
            el.style.display = 'block';
            el.style.color = '#888';
            el.textContent = '正在测试连接...';
            setTimeout(() => {
                el.style.color = '#16a34a';
                el.textContent = '✓ 连接成功 · 模型响应正常 · 延迟 256ms';
            }, 2000);
        }

        document.getElementById('aiProvider').addEventListener('change', function() {
            const urls = {
                openai: 'https://api.openai.com/v1',
                claude: 'https://api.anthropic.com',
                ollama: 'http://localhost:11434',
                vllm: 'http://localhost:8000/v1',
                deepseek: 'https://api.deepseek.com/v1',
                qwen: 'https://dashscope.aliyuncs.com/compatible-mode/v1'
            };
            document.getElementById('aiBaseUrl').value = urls[this.value] || '';
        });

        // 初始化加载用户列表
        document.addEventListener('DOMContentLoaded', loadUsers);
    </script>
</body>
</html>
