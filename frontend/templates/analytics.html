<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据分析 - FORTUNE SCM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen" x-data="analyticsApp()">
    <!-- 导航栏 -->
    <nav class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <h1 class="text-xl font-bold text-gray-800">FORTUNE SCM</h1>
                    <span class="ml-4 text-gray-500">数据分析</span>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="/dashboard.html" class="text-gray-600 hover:text-gray-900">首页</a>
                    <a href="/crm.html" class="text-gray-600 hover:text-gray-900">CRM</a>
                    <button @click="logout()" class="text-gray-600 hover:text-gray-900">退出</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- 统计卡片 -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="bg-white rounded-lg shadow p-6">
                <div class="flex items-center">
                    <div class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center">
                        <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
                        </svg>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm text-gray-500">总客户</p>
                        <p class="text-2xl font-bold text-gray-800" x-text="stats.total_customers"></p>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-lg shadow p-6">
                <div class="flex items-center">
                    <div class="w-12 h-12 bg-green-100 rounded-full flex items-center justify-center">
                        <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm text-gray-500">成交客户</p>
                        <p class="text-2xl font-bold text-gray-800" x-text="stats.by_status.won || 0"></p>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-lg shadow p-6">
                <div class="flex items-center">
                    <div class="w-12 h-12 bg-yellow-100 rounded-full flex items-center justify-center">
                        <svg class="w-6 h-6 text-yellow-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path>
                        </svg>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm text-gray-500">转化率</p>
                        <p class="text-2xl font-bold text-gray-800" x-text="stats.conversion_rate + '%'"></p>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-lg shadow p-6">
                <div class="flex items-center">
                    <div class="w-12 h-12 bg-purple-100 rounded-full flex items-center justify-center">
                        <svg class="w-6 h-6 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm text-gray-500">总收入</p>
                        <p class="text-2xl font-bold text-gray-800" x-text="'$' + stats.total_revenue"></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 图表区域 -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
            <!-- 客户状态分布 -->
            <div class="bg-white rounded-lg shadow p-6">
                <h3 class="text-lg font-medium text-gray-800 mb-4">客户状态分布</h3>
                <canvas id="statusChart" height="200"></canvas>
            </div>

            <!-- 客户来源分布 -->
            <div class="bg-white rounded-lg shadow p-6">
                <h3 class="text-lg font-medium text-gray-800 mb-4">客户来源分布</h3>
                <canvas id="sourceChart" height="200"></canvas>
            </div>
        </div>

        <!-- 销售漏斗 -->
        <div class="bg-white rounded-lg shadow mb-8">
            <div class="px-6 py-4 border-b border-gray-200">
                <h3 class="text-lg font-medium text-gray-800">销售漏斗</h3>
            </div>
            <div class="p-6">
                <div class="space-y-4">
                    <template x-for="stage in pipeline.stages" :key="stage.stage">
                        <div class="flex items-center">
                            <div class="w-32 text-sm font-medium text-gray-700" x-text="stage.stage"></div>
                            <div class="flex-1 mx-4">
                                <div class="w-full bg-gray-200 rounded-full h-8 relative">
                                    <div class="bg-blue-600 h-8 rounded-full flex items-center justify-center text-white text-sm font-medium transition-all"
                                         :style="`width: ${(stage.count / pipeline.total_leads * 100) || 0}%`"
                                         x-text="stage.count"></div>
                                </div>
                            </div>
                            <div class="w-24 text-sm text-gray-500 text-right">
                                <span x-text="stage.conversion_rate + '%'"></span>
                            </div>
                            <div class="w-24 text-sm text-gray-500 text-right">
                                $<span x-text="stage.value"></span>
                            </div>
                        </div>
                    </template>
                </div>
                <div class="mt-6 grid grid-cols-1 md:grid-cols-3 gap-4 text-center">
                    <div class="bg-gray-50 rounded-lg p-4">
                        <p class="text-2xl font-bold text-gray-800" x-text="pipeline.overall_conversion + '%'"></p>
                        <p class="text-sm text-gray-500">整体转化率</p>
                    </div>
                    <div class="bg-gray-50 rounded-lg p-4">
                        <p class="text-2xl font-bold text-gray-800" x-text="'$' + pipeline.avg_deal_size"></p>
                        <p class="text-sm text-gray-500">平均客单价</p>
                    </div>
                    <div class="bg-gray-50 rounded-lg p-4">
                        <p class="text-2xl font-bold text-gray-800" x-text="pipeline.avg_sales_cycle + '天'"></p>
                        <p class="text-sm text-gray-500">平均销售周期</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 国家分布 -->
        <div class="bg-white rounded-lg shadow mb-8">
            <div class="px-6 py-4 border-b border-gray-200">
                <h3 class="text-lg font-medium text-gray-800">客户国家分布</h3>
            </div>
            <div class="p-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div>
                        <canvas id="countryChart" height="200"></canvas>
                    </div>
                    <div class="space-y-2">
                        <template x-for="(count, country) in stats.by_country" :key="country">
                            <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
                                <span class="text-sm font-medium text-gray-700" x-text="country"></span>
                                <span class="text-sm text-gray-500" x-text="count + ' 客户'"></span>
                            </div>
                        </template>
                    </div>
                </div>
            </div>
        </div>

        <!-- 优先级分布 -->
        <div class="bg-white rounded-lg shadow mb-8">
            <div class="px-6 py-4 border-b border-gray-200">
                <h3 class="text-lg font-medium text-gray-800">客户优先级分布</h3>
            </div>
            <div class="p-6">
                <canvas id="priorityChart" height="100"></canvas>
            </div>
        </div>

        <!-- 最近活动 -->
        <div class="bg-white rounded-lg shadow">
            <div class="px-6 py-4 border-b border-gray-200">
                <h3 class="text-lg font-medium text-gray-800">最近活动</h3>
            </div>
            <div class="p-6">
                <div class="space-y-4">
                    <template x-for="activity in recentActivities" :key="activity.timestamp">
                        <div class="flex items-start space-x-4">
                            <div class="w-8 h-8 rounded-full flex items-center justify-center"
                                 :class="{
                                     'bg-blue-100 text-blue-600': activity.type === 'customer_created',
                                     'bg-green-100 text-green-600': activity.type === 'followup',
                                     'bg-yellow-100 text-yellow-600': activity.type === 'quote_created'
                                 }">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path x-show="activity.type === 'customer_created'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path>
                                    <path x-show="activity.type === 'followup'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path>
                                    <path x-show="activity.type === 'quote_created'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                                </svg>
                            </div>
                            <div class="flex-1">
                                <p class="text-sm text-gray-800" x-text="activity.description"></p>
                                <p class="text-xs text-gray-500 mt-1" x-text="new Date(activity.timestamp).toLocaleString()"></p>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </div>

    <script>
        function analyticsApp() {
            return {
                stats: {
                    total_customers: 0,
                    by_status: {},
                    by_source: {},
                    by_country: {},
                    by_priority: {},
                    conversion_rate: 0,
                    total_revenue: 0,
                    total_quotes: 0,
                    total_orders: 0,
                    new_this_month: 0,
                    new_this_week: 0
                },
                pipeline: {
                    stages: [],
                    total_leads: 0,
                    total_value: 0,
                    overall_conversion: 0,
                    avg_deal_size: 0,
                    avg_sales_cycle: 0
                },
                recentActivities: [],
                charts: {},

                async init() {
                    await this.loadStats();
                    await this.loadPipeline();
                    await this.loadActivities();
                    this.$nextTick(() => {
                        this.renderCharts();
                    });
                },

                async loadStats() {
                    try {
                        const response = await fetch('/api/crm/stats', {
                            headers: { 'Authorization': `Bearer ${localStorage.getItem('access_token')}` }
                        });
                        if (response.ok) {
                            this.stats = await response.json();
                        }
                    } catch (e) {
                        console.error('加载统计失败:', e);
                    }
                },

                async loadPipeline() {
                    try {
                        const response = await fetch('/api/crm/pipeline', {
                            headers: { 'Authorization': `Bearer ${localStorage.getItem('access_token')}` }
                        });
                        if (response.ok) {
                            this.pipeline = await response.json();
                        }
                    } catch (e) {
                        console.error('加载漏斗失败:', e);
                    }
                },

                async loadActivities() {
                    try {
                        const response = await fetch('/api/crm/activities', {
                            headers: { 'Authorization': `Bearer ${localStorage.getItem('access_token')}` }
                        });
                        if (response.ok) {
                            this.recentActivities = await response.json();
                        }
                    } catch (e) {
                        console.error('加载活动失败:', e);
                    }
                },

                renderCharts() {
                    this.renderStatusChart();
                    this.renderSourceChart();
                    this.renderCountryChart();
                    this.renderPriorityChart();
                },

                renderStatusChart() {
                    const ctx = document.getElementById('statusChart');
                    if (!ctx) return;
                    
                    const labels = {
                        lead: '潜在客户',
                        contacted: '已联系',
                        quoted: '已报价',
                        negotiating: '谈判中',
                        won: '成交',
                        lost: '流失',
                        hold: '搁置'
                    };
                    
                    const data = Object.entries(this.stats.by_status).map(([key, value]) => ({
                        label: labels[key] || key,
                        value: value
                    }));
                    
                    new Chart(ctx, {
                        type: 'doughnut',
                        data: {
                            labels: data.map(d => d.label),
                            datasets: [{
                                data: data.map(d => d.value),
                                backgroundColor: [
                                    '#9CA3AF', '#3B82F6', '#F59E0B', '#F97316', '#10B981', '#EF4444', '#8B5CF6'
                                ]
                            }]
                        },
                        options: {
                            responsive: true,
                            plugins: {
                                legend: {
                                    position: 'bottom'
                                }
                            }
                        }
                    });
                },

                renderSourceChart() {
                    const ctx = document.getElementById('sourceChart');
                    if (!ctx) return;
                    
                    const labels = {
                        linkedin: 'LinkedIn',
                        email: '邮件',
                        phone: '电话',
                        website: '网站',
                        referral: '推荐',
                        trade_show: '展会',
                        cold_call: '陌拜',
                        other: '其他'
                    };
                    
                    const data = Object.entries(this.stats.by_source).map(([key, value]) => ({
                        label: labels[key] || key,
                        value: value
                    }));
                    
                    new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: data.map(d => d.label),
                            datasets: [{
                                label: '客户数',
                                data: data.map(d => d.value),
                                backgroundColor: '#3B82F6'
                            }]
                        },
                        options: {
                            responsive: true,
                            plugins: {
                                legend: {
                                    display: false
                                }
                            }
                        }
                    });
                },

                renderCountryChart() {
                    const ctx = document.getElementById('countryChart');
                    if (!ctx) return;
                    
                    const data = Object.entries(this.stats.by_country)
                        .sort((a, b) => b[1] - a[1])
                        .slice(0, 10);
                    
                    new Chart(ctx, {
                        type: 'pie',
                        data: {
                            labels: data.map(d => d[0]),
                            datasets: [{
                                data: data.map(d => d[1]),
                                backgroundColor: [
                                    '#3B82F6', '#10B981', '#F59E0B', '#EF4444', '#8B5CF6',
                                    '#EC4899', '#06B6D4', '#84CC16', '#F97316', '#6366F1'
                                ]
                            }]
                        },
                        options: {
                            responsive: true,
                            plugins: {
                                legend: {
                                    position: 'bottom'
                                }
                            }
                        }
                    });
                },

                renderPriorityChart() {
                    const ctx = document.getElementById('priorityChart');
                    if (!ctx) return;
                    
                    const labels = {
                        high: '高',
                        medium: '中',
                        low: '低'
                    };
                    
                    const data = Object.entries(this.stats.by_priority).map(([key, value]) => ({
                        label: labels[key] || key,
                        value: value
                    }));
                    
                    new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: data.map(d => d.label),
                            datasets: [{
                                label: '客户数',
                                data: data.map(d => d.value),
                                backgroundColor: ['#EF4444', '#F59E0B', '#10B981']
                            }]
                        },
                        options: {
                            responsive: true,
                            indexAxis: 'y',
                            plugins: {
                                legend: {
                                    display: false
                                }
                            }
                        }
                    });
                },

                logout() {
                    localStorage.clear();
                    window.location.href = '/login.html';
                }
            }
        }
    </script>
</body>
</html>
