<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>命运 - 登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-container {
            display: flex;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            overflow: hidden;
            width: 900px;
            max-width: 90vw;
        }
        .login-left {
            flex: 1;
            background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px 40px;
        }
        .logo-section {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo-icon {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
        }
        .logo-text {
            font-size: 36px;
            font-weight: 700;
            color: #1a1a1a;
            letter-spacing: 4px;
            margin-bottom: 8px;
        }
        .logo-english {
            font-size: 18px;
            color: #666;
            letter-spacing: 6px;
        }
        .slogan {
            font-size: 14px;
            color: #999;
            margin-top: 30px;
            text-align: center;
            line-height: 1.6;
        }
        .login-right {
            flex: 1;
            padding: 60px 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .login-title {
            font-size: 24px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 8px;
        }
        .login-subtitle {
            font-size: 14px;
            color: #999;
            margin-bottom: 40px;
        }
        .form-group {
            margin-bottom: 24px;
        }
        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #333;
            margin-bottom: 8px;
        }
        .form-input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s;
            outline: none;
        }
        .form-input:focus {
            border-color: #fbbf24;
            box-shadow: 0 0 0 3px rgba(251,191,36,0.1);
        }
        .form-input::placeholder {
            color: #ccc;
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: #fbbf24;
            color: #1a1a1a;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .login-btn:hover {
            background: #f59e0b;
        }
        .form-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }
        .remember-me {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #666;
            cursor: pointer;
        }
        .remember-me input {
            accent-color: #fbbf24;
        }
        .forgot-password {
            font-size: 13px;
            color: #fbbf24;
            text-decoration: none;
        }
        .forgot-password:hover {
            text-decoration: underline;
        }
        .register-link {
            text-align: center;
            margin-top: 30px;
            font-size: 14px;
            color: #999;
        }
        .register-link a {
            color: #fbbf24;
            text-decoration: none;
            font-weight: 500;
        }
        .register-link a:hover {
            text-decoration: underline;
        }
        .error-message {
            background: #fee2e2;
            color: #dc2626;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }
        .success-message {
            background: #d1fae5;
            color: #059669;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-left">
            <div class="logo-section">
                <svg class="logo-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- 方案二：抽象飞机线条 -->
                    <path d="M20 55 L50 20 L80 55" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M30 48 L50 28 L70 48" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="50" cy="60" r="5" fill="#fbbf24"/>
                    <path d="M43 68 L50 60 L57 68" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
                    <!-- 曙光黄光晕 -->
                    <circle cx="50" cy="60" r="25" fill="#fbbf24" opacity="0.12"/>
                </svg>
                <div class="logo-text">命运</div>
                <div class="logo-english">DESTINY</div>
            </div>
            <div class="slogan">
                智能客户开发系统<br>
                让每一次连接都充满可能
            </div>
        </div>
        <div class="login-right">
            <div class="login-title">欢迎回来</div>
            <div class="login-subtitle">请登录您的账户</div>
            
            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>
            
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label">用户名</label>
                    <input type="text" class="form-input" id="username" placeholder="请输入用户名" required>
                </div>
                <div class="form-group">
                    <label class="form-label">密码</label>
                    <input type="password" class="form-input" id="password" placeholder="请输入密码" required>
                </div>
                <button type="submit" class="login-btn">登录</button>
            </form>
            
            <div class="form-footer">
                <label class="remember-me">
                    <input type="checkbox"> 记住我
                </label>
                <a href="#" class="forgot-password">忘记密码？</a>
            </div>
            
            <div class="register-link">
                还没有账户？<a href="#" onclick="showRegister()">立即注册</a>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        
        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            
            try {
                const response = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    successDiv.textContent = '登录成功，正在跳转...';
                    successDiv.style.display = 'block';
                    setTimeout(() => {
                        window.location.href = '/dashboard.html';
                    }, 1000);
                } else {
                    errorDiv.textContent = data.detail || '登录失败';
                    errorDiv.style.display = 'block';
                }
            } catch (err) {
                errorDiv.textContent = '网络错误，请稍后重试';
                errorDiv.style.display = 'block';
            }
        }
        
        function showRegister() {
            // 跳转到注册页面或显示注册表单
            alert('注册功能开发中');
        }
    </script>
</body>
</html>
