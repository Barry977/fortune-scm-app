name: Build 命运 (DESTINY) Desktop App

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows app
        run: python build.py

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          # Download and install Inno Setup
          $issUrl = "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe"
          $issInstaller = "$env:TEMP\innosetup.exe"
          Invoke-WebRequest -Uri $issUrl -OutFile $issInstaller
          Start-Process -FilePath $issInstaller -ArgumentList "/VERYSILENT /NORESTART /SUPPRESSMSGBOXES" -Wait
          # Compile the installer
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss

      - name: Create zip package
        shell: pwsh
        run: |
          $destDir = "命运"
          if (Test-Path "dist/$destDir") {
            Compress-Archive -Path "dist/$destDir/*" -DestinationPath "dist/Destiny-Windows.zip"
          } elseif (Test-Path "dist/Destiny") {
            Compress-Archive -Path "dist/Destiny/*" -DestinationPath "dist/Destiny-Windows.zip"
          }

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Destiny-Windows
          path: dist/Destiny-Windows.zip
          if-no-files-found: warn

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Destiny-Setup
          path: installer-output/Destiny-Setup.exe
          if-no-files-found: warn

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build macOS app
        run: python build.py

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: Destiny-macOS
          path: dist/Destiny-Installer.dmg
          if-no-files-found: warn

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Destiny-Windows/Destiny-Windows.zip
            artifacts/Destiny-Setup/Destiny-Setup.exe
            artifacts/Destiny-macOS/Destiny-Installer.dmg
          generate_release_notes: true
