name: Build Fortune SCM

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt
      
      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --name FortuneSCM --add-data "frontend;frontend" --add-data "backend;backend" --add-data "requirements.txt;." start.py
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FortuneSCM-Windows
          path: dist/FortuneSCM.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt
      
      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --name FortuneSCM --add-data "frontend:frontend" --add-data "backend:backend" --add-data "requirements.txt:." start.py
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FortuneSCM-macOS
          path: dist/FortuneSCM

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt
      
      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --name FortuneSCM --add-data "frontend:frontend" --add-data "backend:backend" --add-data "requirements.txt:." start.py
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FortuneSCM-Linux
          path: dist/FortuneSCM
