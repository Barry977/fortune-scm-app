name: Build 命运 (DESTINY) Desktop App

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows app
        run: python build.py

      - name: Create zip package
        shell: pwsh
        run: |
          $destDir = "命运"
          if (Test-Path "dist/$destDir") {
            Compress-Archive -Path "dist/$destDir/*" -DestinationPath "dist/Destiny-Windows.zip"
          } elseif (Test-Path "dist/Destiny") {
            Compress-Archive -Path "dist/Destiny/*" -DestinationPath "dist/Destiny-Windows.zip"
          }

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Destiny-Windows
          path: dist/Destiny-Windows.zip
          if-no-files-found: warn

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build macOS app
        run: python build.py

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: Destiny-macOS
          path: dist/Destiny-Installer.dmg
          if-no-files-found: warn
