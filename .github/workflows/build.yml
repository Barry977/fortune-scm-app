name: Build 命运 (DESTINY) Desktop App

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install Playwright Chromium
        shell: pwsh
        run: |
          python -m playwright install chromium
          # Find and print Chromium path for debugging
          $browsersPath = "$env:LOCALAPPDATA\ms-playwright"
          if (Test-Path $browsersPath) {
            Get-ChildItem $browsersPath | Select-Object Name
            Write-Host "Chromium installed at: $browsersPath"
          } else {
            Write-Host "Default path not found, checking alternatives..."
            $homePath = "$env:USERPROFILE\.cache\ms-playwright"
            if (Test-Path $homePath) {
              Get-ChildItem $homePath | Select-Object Name
              Write-Host "Chromium installed at: $homePath"
            }
          }

      - name: Build Windows app
        run: python build.py

      - name: Create installer package
        shell: pwsh
        run: |
          # Create installer directory structure
          $installerDir = "dist\Destiny-Installer"
          New-Item -ItemType Directory -Path $installerDir -Force

          # Copy app files to 'app' subfolder
          $appDir = Join-Path $installerDir "app"
          if (Test-Path "dist\Destiny") {
            Copy-Item -Path "dist\Destiny" -Destination $appDir -Recurse
          }

          # Copy installer scripts
          Copy-Item -Path "installer\install.ps1" -Destination $installerDir
          Copy-Item -Path "installer\install.bat" -Destination $installerDir

          # Create zip
          Compress-Archive -Path "$installerDir\*" -DestinationPath "dist\Destiny-Installer.zip"

      - name: Build NSIS installer
        shell: pwsh
        run: |
          # Install NSIS
          choco install nsis -y

          # Prepare NSIS build directory
          $nsisDir = "installer\nsis\app"
          New-Item -ItemType Directory -Path $nsisDir -Force

          # Copy PyInstaller output to NSIS app directory
          if (Test-Path "dist\Destiny") {
            Copy-Item -Path "dist\Destiny\*" -Destination $nsisDir -Recurse
          }

          # Build NSIS installer
          & "C:\Program Files (x86)\NSIS\makensis.exe" "installer\nsis\installer.nsi"

          # Move the installer to dist
          if (Test-Path "installer\nsis\Destiny-Setup.exe") {
            Move-Item -Path "installer\nsis\Destiny-Setup.exe" -Destination "dist\Destiny-Setup.exe" -Force
          }

      - name: Create portable zip
        shell: pwsh
        run: |
          $destDir = "命运"
          if (Test-Path "dist/$destDir") {
            Compress-Archive -Path "dist/$destDir/*" -DestinationPath "dist/Destiny-Windows.zip"
          } elseif (Test-Path "dist/Destiny") {
            Compress-Archive -Path "dist/Destiny/*" -DestinationPath "dist/Destiny-Windows.zip"
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Destiny-Installer
          path: dist/Destiny-Installer.zip
          if-no-files-found: warn

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: Destiny-Setup
          path: dist/Destiny-Setup.exe
          if-no-files-found: warn

      - name: Upload Windows portable
        uses: actions/upload-artifact@v4
        with:
          name: Destiny-Windows
          path: dist/Destiny-Windows.zip
          if-no-files-found: warn

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build macOS app
        run: python build.py

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: Destiny-macOS
          path: dist/Destiny-Installer.dmg
          if-no-files-found: warn

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Destiny-Installer/Destiny-Installer.zip
            artifacts/Destiny-Setup/Destiny-Setup.exe
            artifacts/Destiny-Windows/Destiny-Windows.zip
            artifacts/Destiny-macOS/Destiny-Installer.dmg
          generate_release_notes: true
